<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stile</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
:root{--nav-pill:#E2DBD0;--surface-canvas:#F4F1EC;--surface-raised:#FFFFFF;--surface-sunken:#ECE7E0;--text-primary:#1F1C1A;--text-secondary:#5E5852;--text-tertiary:#6F6962;--border-subtle:rgba(31,28,26,.08);--border-strong:rgba(31,28,26,.16);--action-primary:#1F1C1A;--action-on-primary:#F4F1EC;--font-ui:"Manrope",system-ui,sans-serif;--radius-md:10px;--radius-lg:16px;--radius-pill:999px;--elev-1:inset 0 0 0 .5px rgba(31,28,26,.08),0 1px 2px rgba(31,28,26,.04)}
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface-canvas); color: var(--text-primary); font-family: var(--font-ui); display: flex; flex-direction: column; overflow: hidden">
  <main style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 40px 20px 0; display: flex; flex-direction: column; gap: 22px">
    <header style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 300; letter-spacing: -0.02em">Stile</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--text-secondary)">So räumt die KI deinen Text auf. Der aktive Stil läuft nach jedem Diktat.</p>
    </header>

    <section aria-label="Aktiver Stil" style="background: var(--surface-raised); border-radius: var(--radius-lg); box-shadow: var(--elev-1), inset 0 0 0 1.5px var(--action-primary); padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 10px">
        <h2 style="margin: 0; flex-grow: 1; font-size: 18px; line-height: 26px; font-weight: 600">Aufräumen</h2>
        <span style="font-size: 12px; line-height: 16px; font-weight: 700; color: var(--action-on-primary); background: var(--action-primary); border-radius: var(--radius-pill); padding: 4px 10px">Aktiv</span>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 21px; color: var(--text-secondary)">Füllwörter und Versprecher raus, Satzzeichen und Absätze rein. Inhalt und Tonfall bleiben.</p>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px">
        <span style="font-size: 15px; font-weight: 600">Nach jedem Diktat anwenden</span>
        <button type="button" role="switch" aria-checked="true" aria-label="Nach jedem Diktat anwenden" style="width: 52px; height: 32px; border: 0; padding: 0; border-radius: var(--radius-pill); background: var(--action-primary); position: relative; cursor: pointer; flex-shrink: 0">
          <span style="position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 12px; background: var(--action-on-primary)"></span>
        </button>
      </div>
    </section>

    <section aria-label="Weitere Stile" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" style="text-align: left; background: var(--surface-raised); border: 0; box-shadow: var(--elev-1); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 6px; color: var(--text-primary); font-family: inherit; cursor: pointer; min-height: 108px">
        <span style="font-size: 16px; font-weight: 600">Wörtlich</span>
        <span style="font-size: 13px; line-height: 19px; color: var(--text-secondary)">Nur Satzzeichen, nichts umformulieren</span>
      </button>
      <button type="button" style="text-align: left; background: var(--surface-raised); border: 0; box-shadow: var(--elev-1); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 6px; color: var(--text-primary); font-family: inherit; cursor: pointer; min-height: 108px">
        <span style="font-size: 16px; font-weight: 600">E-Mail</span>
        <span style="font-size: 13px; line-height: 19px; color: var(--text-secondary)">Höflich, vollständig, mit Gruß</span>
      </button>
      <button type="button" style="text-align: left; background: var(--surface-raised); border: 0; box-shadow: var(--elev-1); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 6px; color: var(--text-primary); font-family: inherit; cursor: pointer; min-height: 108px">
        <span style="font-size: 16px; font-weight: 600">Chat</span>
        <span style="font-size: 13px; line-height: 19px; color: var(--text-secondary)">Locker und kurz</span>
      </button>
      <button type="button" style="text-align: left; background: var(--surface-raised); border: 0; box-shadow: var(--elev-1); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 6px; color: var(--text-primary); font-family: inherit; cursor: pointer; min-height: 108px">
        <span style="font-size: 16px; font-weight: 600">Aktenvermerk</span>
        <span style="font-size: 13px; line-height: 19px; color: var(--text-secondary)">Sachlich, Behördendeutsch, Stichpunkte</span>
      </button>
    </section>

    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: var(--radius-pill); border: 1.5px dashed var(--border-strong); background: transparent; color: var(--text-primary); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Neuer Stil
    </button>
  </main>

  <nav aria-label="Hauptnavigation" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 12px 12px 24px; background: var(--surface-raised); border-top: 1px solid var(--border-subtle)">
    <a href="Main.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--text-tertiary); font-size: 12px; font-weight: 600">
      <span style="width: 64px; height: 22px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"></path></svg>
      </span>Start</a>
    <a href="Woerterbuch.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--text-tertiary); font-size: 12px; font-weight: 600">
      <span style="width: 64px; height: 22px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>
      </span>Wörterbuch</a>
    <a href="Stile.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--text-primary); font-size: 12px; font-weight: 700">
      <span style="width: 64px; height: 22px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.6L18 9.4l-4.2 1.8L12 16l-1.8-4.8L6 9.4l4.2-1.8z"></path><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
      </span>Stile</a>
    <a href="Einstellungen.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--text-tertiary); font-size: 12px; font-weight: 600">
      <span style="width: 64px; height: 22px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"></path></svg>
      </span>Einstellungen</a>
  </nav>
</div>
</x-dc>

</body>
</html>
